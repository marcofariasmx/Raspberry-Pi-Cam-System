<!DOCTYPE html>
<html>
<head>
    <title>Pi Camera Stream</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }
        
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #stream {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .metrics-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
            transition: transform 0.3s ease;
            z-index: 100;
        }
        
        .metrics-bar.hidden {
            transform: translateY(100%);
        }
        
        .metric {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .metric-label {
            color: #888;
        }
        
        .metric-value {
            color: #fff;
            font-variant-numeric: tabular-nums;
        }
        
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4CAF50;
            margin-right: 4px;
        }
        
        .status-indicator.warning {
            background: #FF9800;
        }
        
        .status-indicator.error {
            background: #F44336;
        }
        
        .toggle-metrics {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
            z-index: 101;
        }
        
        .toggle-metrics:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        @media (max-width: 768px) {
            .metrics-bar {
                flex-direction: column;
                gap: 4px;
                padding: 8px;
                font-size: 11px;
            }
            
            .metric {
                justify-content: space-between;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <!-- WebRTC Video Element (Primary) -->
        <video id="webrtcStream" autoplay muted playsinline style="display: none;">
        </video>
        
        <!-- HLS Video Element (Fallback) -->
        <video id="hlsStream" autoplay muted playsinline style="display: none;">
            <source id="hlsSource" src="" type="application/vnd.apple.mpegurl">
        </video>
    </div>
    
    <div class="metrics-bar" id="metricsBar">
        <div class="metric">
            <div class="status-indicator" id="statusIndicator"></div>
            <span class="metric-label">Resolution:</span>
            <span class="metric-value" id="resolution">{{ config.stream_width }}×{{ config.stream_height }}</span>
        </div>
        <div class="metric">
            <span class="metric-label">FPS:</span>
            <span class="metric-value" id="actualFps">--</span>
            <span class="metric-label"> / </span>
            <span class="metric-value" id="targetFps">--</span>
            <span class="metric-label"> (actual/expected)</span>
        </div>
        <div class="metric" id="protocolMetric">
            <span class="metric-label">Protocol:</span>
            <span class="metric-value" id="protocol">--</span>
        </div>
        <div class="metric" id="qualityMetric">
            <span class="metric-label" id="qualityLabel">Quality:</span>
            <span class="metric-value" id="quality">{{ config.jpeg_quality }}%</span>
        </div>
        <div class="metric">
            <span class="metric-label">Latency:</span>
            <span class="metric-value" id="latency">--ms</span>
        </div>
    </div>
    
    <button class="toggle-metrics" id="toggleMetrics" title="Toggle metrics display">📊</button>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.10/dist/hls.min.js"></script>
    <script src="/static/metrics.js"></script>
    <script>
        let metricsVisible = true;
        let currentProtocol = null;
        let webrtcConnection = null;
        
        // Get DOM elements
        const metricsBar = document.getElementById('metricsBar');
        const toggleButton = document.getElementById('toggleMetrics');
        const webrtcStream = document.getElementById('webrtcStream');
        const hlsStream = document.getElementById('hlsStream');
        
        // Toggle metrics visibility
        toggleButton.addEventListener('click', () => {
            metricsVisible = !metricsVisible;
            metricsBar.classList.toggle('hidden', !metricsVisible);
            toggleButton.textContent = metricsVisible ? '📊' : '👁️';
        });
        
        // Initialize streaming
        async function initializeStream() {
            try {
                console.log('🚀 Initializing stream...');
                
                // Get stream information from backend and trigger H.264 streaming
                const streamResponse = await fetch('/api/camera/stream');
                const streamResult = await streamResponse.json();
                
                const infoResponse = await fetch('/api/camera/stream/info');
                const streamInfo = await infoResponse.json();
                
                console.log('📡 Stream info:', streamInfo);
                
                if (!streamInfo.camera_available) {
                    showError('Camera not available');
                    return;
                }
                
                // Try H.264 streams (HLS first for LL-HLS priority, then WebRTC as fallback) 
                if (streamInfo.streams.h264) {
                    // Try LL-HLS first (primary protocol)
                    if (await tryHLS(streamInfo.streams.h264.hls)) {
                        currentProtocol = 'LL-HLS';
                        return;
                    }
                    
                    // Fallback to WebRTC if HLS fails
                    if (await tryWebRTC(streamInfo.streams.h264.webrtc)) {
                        currentProtocol = 'WebRTC';
                        return;
                    }
                    
                    // H.264 failed
                    showError('H.264 streaming failed. Check MediaMTX service.');
                } else {
                    showError('No streaming protocols available');
                }
                
            } catch (error) {
                console.error('❌ Failed to initialize stream:', error);
                showError('Failed to initialize stream');
            }
        }
        
        // Try WebRTC streaming
        async function tryWebRTC(whepUrl) {
            if (!window.RTCPeerConnection) {
                console.log('⚠️  WebRTC not supported');
                return false;
            }
            
            try {
                console.log('🔗 Trying WebRTC...');
                
                // Create RTCPeerConnection with proper ICE configuration
                webrtcConnection = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });
                
                // Handle incoming stream
                webrtcConnection.ontrack = (event) => {
                    console.log('📺 WebRTC stream received');
                    webrtcStream.srcObject = event.streams[0];
                    showStream('webrtc');
                };
                
                // Add a transceiver to receive video
                webrtcConnection.addTransceiver('video', { direction: 'recvonly' });
                
                // Create offer and connect to MediaMTX WHEP endpoint
                const offer = await webrtcConnection.createOffer();
                await webrtcConnection.setLocalDescription(offer);
                
                const response = await fetch(whepUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/sdp' },
                    body: offer.sdp
                });
                
                if (response.ok) {
                    const answer = await response.text();
                    await webrtcConnection.setRemoteDescription({
                        type: 'answer',
                        sdp: answer
                    });
                    
                    console.log('✅ WebRTC connected');
                    return true;
                } else {
                    const errorText = await response.text();
                    console.error('❌ WebRTC error:', response.status, errorText);
                }
                
            } catch (error) {
                console.log('❌ WebRTC failed:', error);
                if (webrtcConnection) {
                    webrtcConnection.close();
                    webrtcConnection = null;
                }
            }
            
            return false;
        }
        
        // Try HLS streaming with LL-HLS optimization
        async function tryHLS(hlsUrl) {
            try {
                console.log('🎬 Trying LL-HLS (Low-Latency HLS)...');
                
                // Check if browser supports HLS natively
                if (hlsStream.canPlayType('application/vnd.apple.mpegurl')) {
                    console.log('📱 Using native HLS support');
                    document.getElementById('hlsSource').src = hlsUrl;
                    hlsStream.load();
                    showStream('hls');
                    return true;
                }
                
                // Try HLS.js if available with LL-HLS configuration
                if (window.Hls && Hls.isSupported()) {
                    console.log('📚 Using HLS.js with LL-HLS configuration');
                    const hls = new Hls({
                        // LL-HLS optimizations
                        enableWorker: true,
                        lowLatencyMode: true,
                        backBufferLength: 90,
                        maxBufferSize: 0,
                        maxBufferLength: 5,
                        maxMaxBufferLength: 10,
                        liveSyncDurationCount: 2,
                        liveMaxLatencyDurationCount: 4,
                        liveDurationInfinity: true,
                        // Aggressive settings for low latency
                        highBufferWatchdogPeriod: 1,
                        nudgeMaxRetry: 5,
                        nudgeOffset: 0.1,
                        maxFragLookUpTolerance: 0.1,
                        // Enable partial segments
                        progressive: true,
                        renderTextTracksNatively: false
                    });
                    
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        console.log('✅ LL-HLS manifest loaded');
                        hlsStream.play();
                    });
                    
                    hls.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            console.error('❌ Fatal HLS error:', data.type);
                            hls.destroy();
                        }
                    });
                    
                    hls.loadSource(hlsUrl);
                    hls.attachMedia(hlsStream);
                    showStream('hls');
                    return true;
                }
                
                console.log('⚠️  HLS not supported');
                
            } catch (error) {
                console.log('❌ HLS failed:', error);
            }
            
            return false;
        }
        
        // Show specific stream element
        function showStream(type) {
            // Hide all streams
            webrtcStream.style.display = 'none';
            hlsStream.style.display = 'none';
            
            // Show selected stream
            switch (type) {
                case 'webrtc':
                    webrtcStream.style.display = 'block';
                    break;
                case 'hls':
                    hlsStream.style.display = 'block';
                    break;
            }
        }
        
        // Show error message
        function showError(message) {
            console.error('❌', message);
            // You could show an error overlay here
        }
        
        // Start metrics monitoring
        streamMetrics.start();
        
        // Update metrics display
        async function updateMetricsDisplay() {
            try {
                const metrics = await getAllMetrics();
                
                // Update protocol display
                document.getElementById('protocol').textContent = currentProtocol || '--';
                
                // Update FPS (WebRTC/HLS have built-in metrics)
                const actualFpsElement = document.getElementById('actualFps');
                actualFpsElement.textContent = 'N/A';
                
                // Update other metrics
                document.getElementById('latency').textContent = 
                    metrics.latency_ms ? `${metrics.latency_ms}ms` : '--ms';
                
                // Update status indicator
                const indicator = document.getElementById('statusIndicator');
                if (metrics.backend?.camera_available && currentProtocol) {
                    indicator.className = 'status-indicator';
                } else if (metrics.backend?.camera_available) {
                    indicator.className = 'status-indicator warning';
                } else {
                    indicator.className = 'status-indicator error';
                }
                
                // Update backend metrics
                if (metrics.backend) {
                    if (metrics.backend.resolution) {
                        document.getElementById('resolution').textContent = 
                            `${metrics.backend.resolution.width}×${metrics.backend.resolution.height}`;
                    }
                    document.getElementById('targetFps').textContent = metrics.backend.target_fps || '--';
                    
                    // Update bitrate display
                    const qualityLabel = document.getElementById('qualityLabel');
                    const qualityValue = document.getElementById('quality');
                    
                    qualityLabel.textContent = 'Bitrate:';
                    const bitrateMbps = (metrics.backend.h264_bitrate || 0) / 1000000;
                    qualityValue.textContent = `${bitrateMbps}Mbps`;
                }
                
            } catch (error) {
                console.warn('Failed to update metrics display:', error);
            }
        }
        
        // Initialize everything
        initializeStream();
        setInterval(updateMetricsDisplay, 1000);
        setTimeout(updateMetricsDisplay, 500);
    </script>
</body>
</html>
