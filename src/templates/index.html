<!DOCTYPE html>
<html>
<head>
    <title>Pi Camera WebCodecs Stream</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }
        
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #videoCanvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        #fallbackVideo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }
        
        .metrics-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
            transition: transform 0.3s ease;
            z-index: 100;
        }
        
        .metrics-bar.hidden {
            transform: translateY(100%);
        }
        
        .metric {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .metric-label {
            color: #888;
        }
        
        .metric-value {
            color: #fff;
            font-variant-numeric: tabular-nums;
        }
        
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4CAF50;
            margin-right: 4px;
        }
        
        .status-indicator.warning {
            background: #FF9800;
        }
        
        .status-indicator.error {
            background: #F44336;
        }
        
        .toggle-metrics {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
            z-index: 101;
        }
        
        .toggle-metrics:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .error-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(244, 67, 54, 0.9);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            z-index: 1000;
            display: none;
        }

        .loading-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            z-index: 1000;
        }
        
        @media (max-width: 768px) {
            .metrics-bar {
                flex-direction: column;
                gap: 4px;
                padding: 8px;
                font-size: 11px;
            }
            
            .metric {
                justify-content: space-between;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <!-- WebCodecs Canvas (Primary) -->
        <canvas id="videoCanvas" width="1200" height="900"></canvas>
        
        <!-- Fallback Video Element (MSE/Broadway) -->
        <video id="fallbackVideo" autoplay muted playsinline></video>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div>🚀 Initializing WebCodecs stream...</div>
        <div style="margin-top: 10px; font-size: 12px; color: #888;">
            Attempting to connect via WebSocket
        </div>
    </div>

    <div class="error-overlay" id="errorOverlay">
        <div id="errorMessage">Connection failed</div>
        <div style="margin-top: 10px; font-size: 12px;">
            <button onclick="location.reload()" style="background: #fff; color: #000; border: none; padding: 8px 16px; border-radius: 4px;">Reload</button>
        </div>
    </div>
    
    <div class="metrics-bar" id="metricsBar">
        <div class="metric">
            <div class="status-indicator" id="statusIndicator"></div>
            <span class="metric-label">Resolution:</span>
            <span class="metric-value" id="resolution">{{ config.stream_width }}×{{ config.stream_height }}</span>
        </div>
        <div class="metric">
            <span class="metric-label">FPS:</span>
            <span class="metric-value" id="actualFps">--</span>
            <span class="metric-label"> / </span>
            <span class="metric-value" id="targetFps">{{ config.stream_fps }}</span>
        </div>
        <div class="metric" id="protocolMetric">
            <span class="metric-label">Decoder:</span>
            <span class="metric-value" id="decoder">--</span>
        </div>
        <div class="metric" id="qualityMetric">
            <span class="metric-label">Bitrate:</span>
            <span class="metric-value" id="bitrate">{{ config.h264_bitrate // 1000000 }}Mbps</span>
        </div>
        <div class="metric">
            <span class="metric-label">Latency:</span>
            <span class="metric-value" id="latency">--ms</span>
        </div>
        <div class="metric">
            <span class="metric-label">Frames:</span>
            <span class="metric-value" id="frameCount">0</span>
        </div>
    </div>
    
    <button class="toggle-metrics" id="toggleMetrics" title="Toggle metrics display">📊</button>
    
    <script src="/static/metrics.js"></script>
    <script>
        // Global state
        let metricsVisible = true;
        let currentPlayer = null;
        let frameCount = 0;
        let startTime = Date.now();
        let lastFrameTime = 0;
        let fpsCounter = 0;
        let fpsInterval = null;

        // DOM elements
        const metricsBar = document.getElementById('metricsBar');
        const toggleButton = document.getElementById('toggleMetrics');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const errorOverlay = document.getElementById('errorOverlay');
        const videoCanvas = document.getElementById('videoCanvas');
        const fallbackVideo = document.getElementById('fallbackVideo');

        // Toggle metrics visibility
        toggleButton.addEventListener('click', () => {
            metricsVisible = !metricsVisible;
            metricsBar.classList.toggle('hidden', !metricsVisible);
            toggleButton.textContent = metricsVisible ? '📊' : '👁️';
        });

        // WebCodecs Player (Tier 1 - Primary)
        class WebCodecsPlayer {
            constructor() {
                this.decoder = null;
                this.websocket = null;
                this.canvas = videoCanvas;
                this.ctx = this.canvas.getContext('2d');
                this.connected = false;
                this.frameQueue = [];
                this.isDecoding = false;
                this.decoderConfigured = false;
                this.frameCount = 0;
                this.spsData = null;
                this.ppsData = null;
            }

            async initialize() {
                // Test WebCodecs support
                if (!('VideoDecoder' in window)) {
                    throw new Error('WebCodecs not supported');
                }

                try {
                    // Initialize decoder (but don't configure yet)
                    this.decoder = new VideoDecoder({
                        output: this.handleFrame.bind(this),
                        error: this.handleError.bind(this)
                    });

                    // Connect WebSocket to receive H.264 stream
                    await this.connectWebSocket();

                    console.log('✅ WebCodecs decoder initialized, waiting for SPS/PPS');
                    return true;
                } catch (error) {
                    console.error('❌ WebCodecs initialization failed:', error);
                    throw error;
                }
            }

            async connectWebSocket() {
                return new Promise((resolve, reject) => {
                    const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const wsUrl = `${wsProtocol}//${location.host}/ws`;
                    
                    console.log('🔌 Connecting to WebSocket:', wsUrl);
                    
                    this.websocket = new WebSocket(wsUrl);
                    this.websocket.binaryType = 'arraybuffer';

                    this.websocket.onopen = () => {
                        console.log('✅ WebSocket connected');
                        this.connected = true;
                        resolve();
                    };

                    this.websocket.onmessage = (event) => {
                        if (typeof event.data === 'string') {
                            // Handle control messages
                            try {
                                const message = JSON.parse(event.data);
                                if (message.type === 'keepalive') {
                                    this.websocket.send('{"type":"pong"}');
                                }
                            } catch (e) {
                                console.warn('Invalid JSON message:', e);
                            }
                        } else {
                            // Handle H.264 Annex B stream data
                            // Extract SPS/PPS from first frame if needed
                            if (!this.decoderConfigured) {
                                this.extractAndConfigure(event.data);
                            } else {
                                this.processH264Frame(event.data);
                            }
                        }
                    };

                    this.websocket.onerror = (error) => {
                        console.error('❌ WebSocket error:', error);
                        reject(error);
                    };

                    this.websocket.onclose = () => {
                        console.log('🔌 WebSocket disconnected');
                        this.connected = false;
                        setTimeout(() => this.reconnect(), 2000);
                    };
                });
            }


            extractAndConfigure(data) {
                try {
                    const view = new Uint8Array(data);
                    
                    // Find NAL units by looking for start codes
                    let sps = null;
                    let pps = null;
                    
                    for (let i = 0; i < view.length - 4; i++) {
                        // Check for start code (0x000001 or 0x00000001)
                        if (view[i] === 0 && view[i+1] === 0 && 
                            ((view[i+2] === 1) || (view[i+2] === 0 && view[i+3] === 1))) {
                            
                            const startOffset = (view[i+2] === 1) ? i + 3 : i + 4;
                            if (startOffset < view.length) {
                                const nalType = view[startOffset] & 0x1F;
                                
                                // Find the end of this NAL unit
                                let endOffset = view.length;
                                for (let j = startOffset + 1; j < view.length - 3; j++) {
                                    if (view[j] === 0 && view[j+1] === 0 && 
                                        (view[j+2] === 1 || (view[j+2] === 0 && view[j+3] === 1))) {
                                        endOffset = j;
                                        break;
                                    }
                                }
                                
                                // SPS (type 7)
                                if (nalType === 7 && !sps) {
                                    sps = view.slice(startOffset, endOffset);
                                    console.log('📄 Found SPS:', sps.length, 'bytes');
                                }
                                // PPS (type 8)
                                else if (nalType === 8 && !pps) {
                                    pps = view.slice(startOffset, endOffset);
                                    console.log('📄 Found PPS:', pps.length, 'bytes');
                                }
                                
                                // If we have both, configure decoder
                                if (sps && pps) {
                                    this.configureWithSPSPPS(sps, pps);
                                    // Also process this frame
                                    this.processH264Frame(data);
                                    return;
                                }
                            }
                        }
                    }
                    
                    // If no SPS/PPS found, try basic configuration
                    console.log('⚠️ No SPS/PPS found in frame, trying basic config');
                    this.configureBasic();
                    
                } catch (error) {
                    console.error('❌ SPS/PPS extraction error:', error);
                    this.configureBasic();
                }
            }
            
            async configureWithSPSPPS(sps, pps) {
                try {
                    // Extract profile, level from SPS
                    const profile = sps[1];
                    const level = sps[3];
                    
                    // Create codec string
                    const codecString = `avc1.${profile.toString(16).padStart(2, '0')}00${level.toString(16).padStart(2, '0')}`;
                    console.log('🔧 Configuring decoder with codec:', codecString);
                    
                    // Create description with SPS and PPS
                    const description = new Uint8Array(sps.length + pps.length + 8);
                    let offset = 0;
                    
                    // Add SPS with length prefix
                    description[offset++] = 0;
                    description[offset++] = 0;
                    description[offset++] = (sps.length >> 8) & 0xFF;
                    description[offset++] = sps.length & 0xFF;
                    description.set(sps, offset);
                    offset += sps.length;
                    
                    // Add PPS with length prefix
                    description[offset++] = 0;
                    description[offset++] = 0;
                    description[offset++] = (pps.length >> 8) & 0xFF;
                    description[offset++] = pps.length & 0xFF;
                    description.set(pps, offset);
                    
                    await this.decoder.configure({
                        codec: codecString,
                        description: description,
                        optimizeForLatency: true,
                        hardwareAcceleration: 'prefer-hardware'
                    });
                    
                    this.decoderConfigured = true;
                    console.log('✅ Decoder configured with SPS/PPS');
                    
                } catch (error) {
                    console.error('❌ Configuration with SPS/PPS failed:', error);
                    this.configureBasic();
                }
            }
            
            async configureBasic() {
                try {
                    // Fallback to basic configuration
                    await this.decoder.configure({
                        codec: 'avc1.42001f',  // H.264 Baseline Profile Level 3.1
                        optimizeForLatency: true,
                        hardwareAcceleration: 'prefer-hardware'
                    });
                    
                    this.decoderConfigured = true;
                    console.log('✅ Decoder configured with basic settings');
                    
                } catch (error) {
                    console.error('❌ Basic configuration failed:', error);
                }
            }

            processH264Frame(data) {
                try {
                    if (this.decoder.state !== 'configured') {
                        console.log('Decoder not ready, skipping frame');
                        return;
                    }

                    frameCount++;
                    const now = Date.now();
                    
                    // Calculate latency (approximate)
                    const latency = now - lastFrameTime;
                    lastFrameTime = now;

                    // Create EncodedVideoChunk from Annex B data
                    // Let WebCodecs handle NAL unit parsing
                    const chunk = new EncodedVideoChunk({
                        type: this.isKeyFrame(data) ? 'key' : 'delta',
                        timestamp: this.frameCount * 33333, // microseconds (30fps)
                        data: data
                    });
                    
                    this.frameCount++;

                    // Decode immediately for minimal latency
                    this.decoder.decode(chunk);

                    // Update metrics
                    document.getElementById('frameCount').textContent = frameCount;
                    document.getElementById('latency').textContent = `${latency}ms`;
                    
                } catch (error) {
                    console.error('❌ Frame processing error:', error);
                    // Try to recover by reconfiguring decoder
                    this.recoverDecoder();
                }
            }

            isKeyFrame(data) {
                // Simple NAL unit detection for keyframes
                const view = new Uint8Array(data);
                for (let i = 0; i < view.length - 4; i++) {
                    if (view[i] === 0x00 && view[i + 1] === 0x00 && 
                        view[i + 2] === 0x00 && view[i + 3] === 0x01) {
                        const nalType = view[i + 4] & 0x1F;
                        return nalType === 5; // IDR frame
                    }
                }
                return false;
            }

            handleFrame(frame) {
                try {
                    // Resize canvas if needed
                    if (this.canvas.width !== frame.displayWidth || 
                        this.canvas.height !== frame.displayHeight) {
                        this.canvas.width = frame.displayWidth;
                        this.canvas.height = frame.displayHeight;
                    }

                    // Draw frame to canvas
                    this.ctx.drawImage(frame, 0, 0);
                    frame.close();

                    // Calculate actual FPS
                    fpsCounter++;
                    
                } catch (error) {
                    console.error('❌ Frame render error:', error);
                    frame.close();
                }
            }

            recoverDecoder() {
                try {
                    console.log('🔄 Attempting decoder recovery...');
                    if (this.decoder && this.decoder.state !== 'closed') {
                        this.decoder.close();
                    }
                    
                    // Recreate decoder
                    this.decoder = new VideoDecoder({
                        output: this.handleFrame.bind(this),
                        error: this.handleError.bind(this)
                    });
                    
                    this.decoderConfigured = false;
                    
                    // Reconfigure if we have SPS/PPS
                    if (this.spsData && this.ppsData) {
                        setTimeout(() => this.configureDecoder(), 100);
                    }
                } catch (error) {
                    console.error('❌ Decoder recovery failed:', error);
                }
            }

            handleError(error) {
                console.error('❌ WebCodecs decoder error:', error);
                this.recoverDecoder();
            }

            async reconnect() {
                if (this.connected) return;
                
                console.log('🔄 Attempting to reconnect...');
                try {
                    await this.connectWebSocket();
                } catch (error) {
                    console.error('❌ Reconnection failed:', error);
                    setTimeout(() => this.reconnect(), 5000);
                }
            }

            cleanup() {
                if (this.websocket) {
                    this.websocket.close();
                }
                if (this.decoder) {
                    this.decoder.close();
                }
                this.connected = false;
            }
        }

        // MSE Player (Tier 2 - Fallback)
        class MSEPlayer {
            constructor() {
                this.video = fallbackVideo;
                this.mediaSource = null;
                this.sourceBuffer = null;
                this.websocket = null;
            }

            async initialize() {
                if (!('MediaSource' in window)) {
                    throw new Error('MSE not supported');
                }

                try {
                    this.mediaSource = new MediaSource();
                    this.video.src = URL.createObjectURL(this.mediaSource);

                    await new Promise((resolve, reject) => {
                        this.mediaSource.addEventListener('sourceopen', resolve);
                        this.mediaSource.addEventListener('error', reject);
                    });

                    // For MSE, we'd need to convert H.264 Annex-B to fMP4
                    // This is a simplified placeholder
                    throw new Error('MSE H.264 conversion not implemented in this demo');
                    
                } catch (error) {
                    console.error('❌ MSE initialization failed:', error);
                    throw error;
                }
            }

            cleanup() {
                if (this.websocket) {
                    this.websocket.close();
                }
            }
        }

        // Broadway Player (Tier 3 - Universal Fallback)
        class BroadwayPlayer {
            constructor() {
                this.canvas = videoCanvas;
            }

            async initialize() {
                // Broadway decoder would be loaded here
                // This is a placeholder for the WebAssembly H.264 decoder
                throw new Error('Broadway decoder not implemented in this demo');
            }

            cleanup() {
                // Cleanup Broadway resources
            }
        }

        // Player selection and initialization
        async function initializePlayer() {
            loadingOverlay.style.display = 'block';
            
            try {
                // Try WebCodecs first (Tier 1)
                console.log('🎯 Attempting WebCodecs (Tier 1)...');
                try {
                    currentPlayer = new WebCodecsPlayer();
                    await currentPlayer.initialize();
                    document.getElementById('decoder').textContent = 'WebCodecs (HW)';
                    console.log('✅ WebCodecs player active');
                    return;
                } catch (error) {
                    console.log('❌ WebCodecs failed:', error.message);
                }

                // Try MSE (Tier 2)
                console.log('🎯 Attempting MSE (Tier 2)...');
                try {
                    currentPlayer = new MSEPlayer();
                    await currentPlayer.initialize();
                    document.getElementById('decoder').textContent = 'MSE';
                    fallbackVideo.style.display = 'block';
                    videoCanvas.style.display = 'none';
                    console.log('✅ MSE player active');
                    return;
                } catch (error) {
                    console.log('❌ MSE failed:', error.message);
                }

                // Try Broadway (Tier 3)
                console.log('🎯 Attempting Broadway (Tier 3)...');
                try {
                    currentPlayer = new BroadwayPlayer();
                    await currentPlayer.initialize();
                    document.getElementById('decoder').textContent = 'Broadway (SW)';
                    console.log('✅ Broadway player active');
                    return;
                } catch (error) {
                    console.log('❌ Broadway failed:', error.message);
                }

                throw new Error('No compatible decoder available');

            } catch (error) {
                console.error('❌ All decoders failed:', error);
                showError('No compatible H.264 decoder available. Please use a modern browser.');
            } finally {
                loadingOverlay.style.display = 'none';
            }
        }

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            errorOverlay.style.display = 'block';
            document.getElementById('statusIndicator').className = 'status-indicator error';
        }

        // FPS calculation
        function startFPSCounter() {
            fpsInterval = setInterval(() => {
                document.getElementById('actualFps').textContent = fpsCounter;
                fpsCounter = 0;
            }, 1000);
        }

        // Initialize metrics monitoring
        if (typeof streamMetrics !== 'undefined') {
            streamMetrics.start();
        }

        // Update status indicator
        function updateStatus() {
            const indicator = document.getElementById('statusIndicator');
            if (currentPlayer && currentPlayer.connected) {
                indicator.className = 'status-indicator';
            } else if (currentPlayer) {
                indicator.className = 'status-indicator warning';
            } else {
                indicator.className = 'status-indicator error';
            }
        }

        // Start everything
        initializePlayer();
        startFPSCounter();
        setInterval(updateStatus, 1000);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (currentPlayer) {
                currentPlayer.cleanup();
            }
            if (fpsInterval) {
                clearInterval(fpsInterval);
            }
        });
    </script>
</body>
</html>
