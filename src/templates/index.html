<!DOCTYPE html>
<html>
<head>
    <title>Pi Camera jMuxer Stream</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }
        
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #videoPlayer {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .metrics-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            font-size: 12px;
            font-family: 'Monaco', 'Menlo', monospace;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }
        
        .metrics-row {
            display: flex;
            justify-content: space-between;
            margin: 2px 0;
        }
        
        .metric-group {
            display: flex;
            gap: 16px;
        }
        
        .metric {
            color: #fff;
        }
        
        .metric.good { color: #4ade80; }
        .metric.warning { color: #fbbf24; }
        .metric.error { color: #f87171; }
        
        .status-indicator {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            z-index: 1000;
        }
        
        .status-connecting {
            background: rgba(251, 191, 36, 0.2);
            border: 1px solid #fbbf24;
            color: #fbbf24;
        }
        
        .status-connected {
            background: rgba(74, 222, 128, 0.2);
            border: 1px solid #4ade80;
            color: #4ade80;
        }
        
        .status-error {
            background: rgba(248, 113, 113, 0.2);
            border: 1px solid #f87171;
            color: #f87171;
        }
    </style>
    <!-- Include jMuxer from CDN with fallback -->
    <script src="https://unpkg.com/jmuxer@2.0.7/dist/jmuxer.min.js"></script>
    <script>
        // Fallback CDN if primary fails
        if (typeof JMuxer === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/jmuxer@2.0.7/dist/jmuxer.min.js"><\/script>');
        }
    </script>
</head>
<body>
    <div class="video-container">
        <!-- HTML5 Video Player with MSE -->
        <video id="videoPlayer" autoplay muted playsinline controls></video>
    </div>
    
    <div class="status-indicator" id="status">
        <div>🚀 Initializing jMuxer stream...</div>
    </div>
    
    <div class="metrics-bar">
        <div class="metrics-row">
            <div class="metric-group">
                <span class="metric" id="connection">⚫ Disconnected</span>
                <span class="metric" id="decoder">📺 jMuxer + MSE</span>
                <span class="metric" id="frames">📊 Frames: 0</span>
                <span class="metric" id="dataRate">📈 0 KB/s</span>
            </div>
            <div class="metric-group">
                <span class="metric" id="resolution">📐 --</span>
                <span class="metric" id="latency">⏱️ --ms</span>
                <span class="metric" id="bufferHealth">🔋 Buffer: --</span>
            </div>
        </div>
    </div>

    <script>
        // jMuxer H.264 Player Implementation
        class JMuxerPlayer {
            constructor() {
                this.websocket = null;
                this.jmuxer = null;
                this.videoElement = document.getElementById('videoPlayer');
                this.frameCount = 0;
                this.startTime = performance.now();
                this.lastDataTime = performance.now();
                this.bytesReceived = 0;
                this.connected = false;
                this.serverFps = 20; // Default, will be updated
                
                // Get server configuration first, then initialize
                this.getServerConfig();
            }
            
            async getServerConfig() {
                try {
                    const response = await fetch('/health');
                    const config = await response.json();
                    
                    this.serverFps = config.fps || 20;
                    console.log(`📊 Server FPS detected: ${this.serverFps}`);
                    
                    // Initialize jMuxer with correct FPS
                    this.initializeJMuxer();
                    
                } catch (error) {
                    console.warn('⚠️ Could not fetch server config, using defaults:', error);
                    this.initializeJMuxer();
                }
            }
            
            initializeJMuxer() {
                try {
                    this.jmuxer = new JMuxer({
                        node: this.videoElement,
                        mode: 'video', // video only
                        fps: this.serverFps, // Use server's actual FPS  
                        debug: false,
                        flushingTime: 0, // Immediate buffer flushing (proven solution)
                        clearBuffer: true, // Auto-clear played buffer
                        maxDelay: 1000 // Drop frames if buffer exceeds 1 second
                    });
                    
                    console.log('✅ jMuxer initialized successfully');
                    this.connect();
                    
                } catch (error) {
                    console.error('❌ jMuxer initialization failed:', error);
                    this.updateStatus('error', 'jMuxer initialization failed');
                }
            }
            
            connect() {
                try {
                    const wsUrl = `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws`;
                    console.log('🔌 Connecting to:', wsUrl);
                    
                    this.websocket = new WebSocket(wsUrl);
                    this.websocket.binaryType = 'arraybuffer';
                    
                    this.websocket.onopen = () => {
                        console.log('🟢 WebSocket connected');
                        this.connected = true;
                        this.updateStatus('connected', '🟢 Connected');
                        this.updateMetrics();
                    };
                    
                    this.websocket.onmessage = (event) => {
                        this.handleData(event.data);
                    };
                    
                    this.websocket.onerror = (error) => {
                        console.error('❌ WebSocket error:', error);
                        this.updateStatus('error', 'Connection error');
                    };
                    
                    this.websocket.onclose = (event) => {
                        console.log('🔴 WebSocket closed:', event.reason);
                        this.connected = false;
                        this.updateStatus('error', 'Connection closed');
                        
                        // Attempt reconnection after 2 seconds
                        setTimeout(() => {
                            if (!this.connected) {
                                console.log('🔄 Attempting reconnection...');
                                this.connect();
                            }
                        }, 2000);
                    };
                    
                } catch (error) {
                    console.error('❌ Connection failed:', error);
                    this.updateStatus('error', 'Connection failed');
                }
            }
            
            handleData(data) {
                if (data instanceof ArrayBuffer) {
                    // Raw H.264 data from server
                    const uint8Array = new Uint8Array(data);
                    
                    // Update metrics
                    this.frameCount++;
                    this.bytesReceived += uint8Array.length;
                    this.lastDataTime = performance.now();
                    
                    try {
                        // Feed raw H.264 data to jMuxer
                        this.jmuxer.feed({
                            video: uint8Array
                        });
                        
                        // Update metrics every 30 frames (~1.5 seconds at 20fps)
                        if (this.frameCount % 30 === 0) {
                            this.updateMetrics();
                        }
                        
                    } catch (error) {
                        console.error('❌ jMuxer feed error:', error);
                    }
                }
            }
            
            updateStatus(type, message) {
                const statusEl = document.getElementById('status');
                statusEl.textContent = message;
                statusEl.className = `status-indicator status-${type}`;
            }
            
            updateMetrics() {
                const now = performance.now();
                const runtime = (now - this.startTime) / 1000;
                const dataRate = this.bytesReceived / runtime / 1024; // KB/s
                
                // Connection status
                const connectionEl = document.getElementById('connection');
                if (this.connected) {
                    connectionEl.textContent = '🟢 Connected';
                    connectionEl.className = 'metric good';
                } else {
                    connectionEl.textContent = '🔴 Disconnected';
                    connectionEl.className = 'metric error';
                }
                
                // Frame count
                document.getElementById('frames').textContent = `📊 Frames: ${this.frameCount}`;
                
                // Data rate
                const dataRateEl = document.getElementById('dataRate');
                dataRateEl.textContent = `📈 ${dataRate.toFixed(1)} KB/s`;
                if (dataRate < 50) {
                    dataRateEl.className = 'metric warning';
                } else {
                    dataRateEl.className = 'metric good';
                }
                
                // Video element metrics
                if (this.videoElement.videoWidth > 0) {
                    document.getElementById('resolution').textContent = 
                        `📐 ${this.videoElement.videoWidth}×${this.videoElement.videoHeight}`;
                }
                
                // Buffer health with enhanced monitoring
                const bufferHealthEl = document.getElementById('bufferHealth');
                try {
                    if (this.videoElement.buffered.length > 0) {
                        const bufferedEnd = this.videoElement.buffered.end(this.videoElement.buffered.length - 1);
                        const currentTime = this.videoElement.currentTime;
                        const bufferSize = bufferedEnd - currentTime;
                        
                        bufferHealthEl.textContent = `🔋 Buffer: ${bufferSize.toFixed(2)}s`;
                        
                        // Log buffer status for monitoring
                        if (bufferSize > 3.0) {
                            console.warn(`⚠️ Buffer growing: ${bufferSize.toFixed(2)}s - jMuxer should handle this`);
                        }
                        
                        if (bufferSize < 0.5) {
                            bufferHealthEl.className = 'metric warning';
                        } else if (bufferSize > 2.0) {
                            bufferHealthEl.className = 'metric error'; // Too much buffer = latency
                        } else {
                            bufferHealthEl.className = 'metric good';
                        }
                    }
                } catch (e) {
                    bufferHealthEl.textContent = '🔋 Buffer: --';
                }
            }
            
            destroy() {
                if (this.websocket) {
                    this.websocket.close();
                }
                if (this.jmuxer) {
                    this.jmuxer.destroy();
                }
            }
        }
        
        // Initialize the player when page loads
        let player = null;
        
        function initializePlayer() {
            console.log('🎬 Starting jMuxer H.264 stream player');
            
            // Check if jMuxer is available
            if (typeof JMuxer === 'undefined') {
                console.error('❌ JMuxer library not loaded');
                document.getElementById('status').textContent = 'JMuxer library failed to load';
                document.getElementById('status').className = 'status-indicator status-error';
                return;
            }
            
            try {
                player = new JMuxerPlayer();
            } catch (error) {
                console.error('❌ Failed to initialize player:', error);
                document.getElementById('status').textContent = 'Failed to initialize player';
                document.getElementById('status').className = 'status-indicator status-error';
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            // Wait a bit for jMuxer to load, then initialize
            setTimeout(initializePlayer, 100);
        });
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (player) {
                player.destroy();
            }
        });
        
        // Handle visibility changes with live streaming optimization
        document.addEventListener('visibilitychange', () => {
            if (player && player.videoElement) {
                if (document.hidden) {
                    console.log('📱 Tab hidden - pausing video');
                    player.videoElement.pause();
                } else {
                    console.log('📱 Tab visible - resuming and jumping to live');
                    
                    // Jump to live position to prevent accumulated delay
                    try {
                        if (player.videoElement.buffered.length > 0) {
                            const bufferedEnd = player.videoElement.buffered.end(player.videoElement.buffered.length - 1);
                            const currentTime = player.videoElement.currentTime;
                            const bufferSize = bufferedEnd - currentTime;
                            
                            // If buffer has grown while tab was hidden, jump to live
                            if (bufferSize > 2.0) {
                                console.log(`🔄 Jumping to live: buffer was ${bufferSize.toFixed(2)}s behind`);
                                player.videoElement.currentTime = bufferedEnd - 0.5; // Stay 0.5s behind live
                            }
                        }
                    } catch (error) {
                        console.warn('Could not jump to live position:', error);
                    }
                    
                    player.videoElement.play();
                }
            }
        });
    </script>
</body>
</html>
