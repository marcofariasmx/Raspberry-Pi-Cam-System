<!DOCTYPE html>
<html>
<head>
    <title>Pi Camera Stream</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }
        
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #stream {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .metrics-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
            transition: transform 0.3s ease;
            z-index: 100;
        }
        
        .metrics-bar.hidden {
            transform: translateY(100%);
        }
        
        .metric {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .metric-label {
            color: #888;
        }
        
        .metric-value {
            color: #fff;
            font-variant-numeric: tabular-nums;
        }
        
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4CAF50;
            margin-right: 4px;
        }
        
        .status-indicator.warning {
            background: #FF9800;
        }
        
        .status-indicator.error {
            background: #F44336;
        }
        
        .toggle-metrics {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
            z-index: 101;
        }
        
        .toggle-metrics:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        @media (max-width: 768px) {
            .metrics-bar {
                flex-direction: column;
                gap: 4px;
                padding: 8px;
                font-size: 11px;
            }
            
            .metric {
                justify-content: space-between;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <img id="stream" src="/api/camera/stream" alt="Camera Stream">
    </div>
    
    <div class="metrics-bar" id="metricsBar">
        <div class="metric">
            <div class="status-indicator" id="statusIndicator"></div>
            <span class="metric-value" id="statusText">Connecting</span>
            <span class="metric-label"> | Resolution:</span>
            <span class="metric-value" id="resolution">{{ config.stream_width }}×{{ config.stream_height }}</span>
        </div>
        <div class="metric">
            <span class="metric-label">FPS:</span>
            <span class="metric-value" id="actualFps">--</span>
            <span class="metric-label"> / </span>
            <span class="metric-value" id="targetFps">--</span>
            <span class="metric-label"> (actual/expected)</span>
        </div>
        <div class="metric">
            <span class="metric-label">Quality:</span>
            <span class="metric-value" id="quality">{{ config.jpeg_quality }}%</span>
        </div>
        <div class="metric">
            <span class="metric-label">Latency:</span>
            <span class="metric-value" id="latency">--ms</span>
        </div>
        <div class="metric">
            <span class="metric-label">Stability:</span>
            <span class="metric-value" id="connectionStability">--</span>
        </div>
        <div class="metric">
            <span class="metric-label">Network:</span>
            <span class="metric-value" id="networkQuality">--</span>
        </div>
        <div class="metric">
            <span class="metric-label">Jitter:</span>
            <span class="metric-value" id="frameJitter">--</span>
        </div>
        <div class="metric">
            <span class="metric-label">Health:</span>
            <span class="metric-value" id="streamHealth">--</span>
        </div>
    </div>
    
    <button class="toggle-metrics" id="toggleMetrics" title="Toggle metrics display">📊</button>
    
    <script src="/static/metrics.js"></script>
    <script>
        let metricsVisible = true;
        const metricsBar = document.getElementById('metricsBar');
        const toggleButton = document.getElementById('toggleMetrics');
        const streamImg = document.getElementById('stream');
        
        // Toggle metrics visibility
        toggleButton.addEventListener('click', () => {
            metricsVisible = !metricsVisible;
            metricsBar.classList.toggle('hidden', !metricsVisible);
            toggleButton.textContent = metricsVisible ? '📊' : '👁️';
        });
        
        // Accurate frame detection for MJPEG streams
        let lastImageData = null;
        let frameCount = 0;
        
        function detectNewFrame() {
            if (streamImg.complete && streamImg.naturalHeight > 0) {
                // For MJPEG streams, we detect new frames by monitoring the load event
                // and using a canvas to detect actual image changes
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 32; // Small sample for performance
                    canvas.height = 32;
                    
                    ctx.drawImage(streamImg, 0, 0, 32, 32);
                    const imageData = ctx.getImageData(0, 0, 32, 32);
                    
                    // Use a hash instead of full comparison for better performance
                    let hash = 0;
                    for (let i = 0; i < imageData.data.length; i += 4) {
                        hash += imageData.data[i] + imageData.data[i+1] + imageData.data[i+2];
                    }
                    
                    // Adaptive threshold based on FPS
                    // Higher FPS = smaller changes between frames, lower threshold
                    // Lower FPS = bigger changes between frames, higher threshold
                    const threshold = Math.max(500, Math.min(2000, 3000 / (targetFPS || 15)));
                    
                    // Compare with last frame hash - only detect significant changes
                    if (!lastImageData || Math.abs(hash - lastImageData) > threshold) {
                        console.log('Frame detected via canvas, calling onFrameReceived');
                        if (typeof streamMetrics !== 'undefined' && streamMetrics.onFrameReceived) {
                            try {
                                console.log('About to call onFrameReceived, method type:', typeof streamMetrics.onFrameReceived);
                                console.log('streamMetrics object:', streamMetrics);
                                streamMetrics.onFrameReceived();
                                console.log('onFrameReceived call completed');
                            } catch (error) {
                                console.error('Error calling onFrameReceived:', error);
                            }
                        } else {
                            console.error('streamMetrics not available:', typeof streamMetrics);
                        }
                        lastImageData = hash;
                        frameCount++;
                    }
                } catch (error) {
                    // Fallback: just count load events
                    console.log('Canvas detection failed, using load event:', error);
                    if (typeof streamMetrics !== 'undefined' && streamMetrics.onFrameReceived) {
                        streamMetrics.onFrameReceived();
                    } else {
                        console.error('streamMetrics not available in fallback:', typeof streamMetrics);
                    }
                    frameCount++;
                }
            }
        }
        
        // Primary detection: MJPEG load events
        streamImg.addEventListener('load', detectNewFrame);
        
        // Adaptive frame detection based on backend FPS
        let lastSrcCheck = '';
        let lastCanvasCheck = 0;
        let targetFPS = 15; // Default fallback
        let detectionInterval = 100; // Default 100ms between detections
        
        // Fetch target FPS from backend and adapt detection
        async function updateDetectionTiming() {
            try {
                const response = await fetch('/api/camera/metrics');
                if (response.ok) {
                    const data = await response.json();
                    if (data.target_fps) {
                        targetFPS = data.target_fps;
                        // Set detection interval to half the frame interval for good detection
                        // e.g., 60fps = 16.7ms interval, detect every 8ms
                        // e.g., 5fps = 200ms interval, detect every 100ms
                        detectionInterval = Math.max(10, (1000 / targetFPS) / 2);
                        console.log(`Adapted detection for ${targetFPS} FPS: checking every ${detectionInterval}ms`);
                    }
                }
            } catch (error) {
                console.warn('Could not fetch target FPS, using default');
            }
        }
        
        // Update detection timing initially and every 10 seconds
        updateDetectionTiming();
        setInterval(updateDetectionTiming, 10000);
        
        setInterval(() => {
            if (streamImg.complete && streamImg.naturalHeight > 0) {
                const now = performance.now();
                
                // Check if src has changed (some MJPEG streams update src)
                if (streamImg.src !== lastSrcCheck) {
                    console.log('Src changed, detecting frame');
                    detectNewFrame();
                    lastSrcCheck = streamImg.src;
                    lastCanvasCheck = now;
                } else if (frameCount < 5) {
                    // Force frame detection for first few frames only
                    detectNewFrame();
                    lastCanvasCheck = now;
                } else if (now - lastCanvasCheck > detectionInterval) {
                    // Adaptive detection interval based on target FPS
                    detectNewFrame();
                    lastCanvasCheck = now;
                }
            }
        }, 10); // Check frequently but only detect when needed based on adaptive interval
        
        // Start monitoring
        streamMetrics.start();
        
        // Update metrics display
        async function updateMetricsDisplay() {
            try {
                const metrics = await getAllMetrics();
                
                // Debug: Log metrics state occasionally
                if (Math.random() < 0.1) { // 10% of the time
                    console.log('Metrics debug:', {
                        actual_fps: metrics.actual_fps,
                        frame_samples: metrics.frame_samples,
                        connection_stability: metrics.connection_stability,
                        network_quality: metrics.network_quality,
                        frame_consistency: metrics.frame_consistency,
                        stream_health: metrics.stream_health
                    });
                    
                    // Also debug the streamMetrics object directly
                    console.log('StreamMetrics object state:', {
                        totalFrames: streamMetrics.totalFrames,
                        frameDeliveryTimes: streamMetrics.frameDeliveryTimes?.length,
                        latencyMeasurements: streamMetrics.latencyMeasurements?.length,
                        isActive: streamMetrics.isActive
                    });
                }
                
                // Update actual FPS
                const actualFpsElement = document.getElementById('actualFps');
                const targetFpsElement = document.getElementById('targetFps');
                
                if (metrics.actual_fps > 0) {
                    actualFpsElement.textContent = metrics.actual_fps.toFixed(1);
                    
                    // Color-code based on actual vs expected FPS
                    const targetFps = metrics.backend?.target_fps;
                    if (targetFps && metrics.actual_fps > 0) {
                        const fpsRatio = metrics.actual_fps / targetFps;
                        if (fpsRatio >= 0.9) { // Within 10% of target
                            actualFpsElement.style.color = '#4CAF50'; // Green
                        } else if (fpsRatio >= 0.7) { // Within 30% of target  
                            actualFpsElement.style.color = '#FF9800'; // Orange
                        } else { // Below 70% of target
                            actualFpsElement.style.color = '#F44336'; // Red
                        }
                    } else {
                        actualFpsElement.style.color = '#fff'; // Default white
                    }
                } else {
                    actualFpsElement.textContent = '--';
                    actualFpsElement.style.color = '#fff';
                }
                
                // Update latency
                document.getElementById('latency').textContent = 
                    metrics.latency_ms ? `${metrics.latency_ms}ms` : '--ms';
                
                // Update status indicator and text
                const indicator = document.getElementById('statusIndicator');
                const statusText = document.getElementById('statusText');
                
                if (metrics.backend?.camera_available && metrics.actual_fps > 0) {
                    indicator.className = 'status-indicator';
                    statusText.textContent = 'Live';
                    statusText.style.color = '#4CAF50';
                } else if (metrics.backend?.camera_available) {
                    indicator.className = 'status-indicator warning';
                    statusText.textContent = 'Buffering';
                    statusText.style.color = '#FF9800';
                } else {
                    indicator.className = 'status-indicator error';
                    statusText.textContent = 'Offline';
                    statusText.style.color = '#F44336';
                }
                
                // Update backend metrics if available
                if (metrics.backend) {
                    if (metrics.backend.resolution) {
                        document.getElementById('resolution').textContent = 
                            `${metrics.backend.resolution.width}×${metrics.backend.resolution.height}`;
                    }
                    document.getElementById('targetFps').textContent = metrics.backend.target_fps || '--';
                    document.getElementById('quality').textContent = `${metrics.backend.jpeg_quality || '--'}%`;
                }
                
                // Update individual signal metrics
                
                // Connection Stability
                const stabilityElement = document.getElementById('connectionStability');
                if (metrics.connection_stability !== null) {
                    stabilityElement.textContent = `${metrics.connection_stability}%`;
                    if (metrics.connection_stability >= 90) stabilityElement.style.color = '#4CAF50';
                    else if (metrics.connection_stability >= 70) stabilityElement.style.color = '#FF9800';
                    else stabilityElement.style.color = '#F44336';
                } else {
                    stabilityElement.textContent = '--';
                    stabilityElement.style.color = '#fff';
                }
                
                // Network Quality
                const networkElement = document.getElementById('networkQuality');
                if (metrics.network_quality) {
                    const net = metrics.network_quality;
                    networkElement.textContent = `${net.avg_latency}ms (${net.min_latency}-${net.max_latency})`;
                    if (net.avg_latency < 50) networkElement.style.color = '#4CAF50';
                    else if (net.avg_latency < 100) networkElement.style.color = '#8BC34A';
                    else if (net.avg_latency < 200) networkElement.style.color = '#FF9800';
                    else networkElement.style.color = '#F44336';
                } else {
                    networkElement.textContent = '--';
                    networkElement.style.color = '#fff';
                }
                
                // Frame Jitter
                const jitterElement = document.getElementById('frameJitter');
                if (metrics.frame_consistency) {
                    const jitter = metrics.frame_consistency;
                    jitterElement.textContent = `${jitter.jitter_ms}ms (${jitter.avg_interval_ms}ms avg)`;
                    if (jitter.jitter_ms < 20) jitterElement.style.color = '#4CAF50';
                    else if (jitter.jitter_ms < 50) jitterElement.style.color = '#8BC34A';
                    else if (jitter.jitter_ms < 100) jitterElement.style.color = '#FF9800';
                    else jitterElement.style.color = '#F44336';
                } else {
                    jitterElement.textContent = '--';
                    jitterElement.style.color = '#fff';
                }
                
                // Stream Health Score
                const healthElement = document.getElementById('streamHealth');
                if (metrics.stream_health) {
                    const health = metrics.stream_health;
                    let healthText = `${health.overall_score}/100`;
                    
                    // Add encoding info if available
                    if (health.encoding_health && health.encoding_health.frames_encoded > 0) {
                        const enc = health.encoding_health;
                        healthText += ` (${enc.frames_encoded}f, ${enc.avg_encode_time_ms}ms enc)`;
                        if (enc.encoding_errors > 0) {
                            healthText += ` [${enc.encoding_errors} err]`;
                        }
                    }
                    
                    healthElement.textContent = healthText;
                    
                    // Color code by overall score
                    if (health.overall_score >= 90) healthElement.style.color = '#4CAF50';
                    else if (health.overall_score >= 80) healthElement.style.color = '#8BC34A';
                    else if (health.overall_score >= 70) healthElement.style.color = '#FFC107';
                    else if (health.overall_score >= 60) healthElement.style.color = '#FF9800';
                    else healthElement.style.color = '#F44336';
                } else {
                    healthElement.textContent = '--';
                    healthElement.style.color = '#fff';
                }
                
            } catch (error) {
                console.warn('Failed to update metrics display:', error);
            }
        }
        
        // Update metrics every second
        setInterval(updateMetricsDisplay, 1000);
        
        // Initial update
        setTimeout(updateMetricsDisplay, 500);
    </script>
</body>
</html>
