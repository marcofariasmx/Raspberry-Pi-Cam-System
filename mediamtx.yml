# MediaMTX Configuration for Raspberry Pi H.264 Streaming - LL-HLS Optimized

# General settings
logLevel: info
logDestinations: [stdout]

# API settings
api: yes
apiAddress: 127.0.0.1:9997

# Metrics
metrics: yes
metricsAddress: 127.0.0.1:9998

# WebRTC settings
webrtc: yes
webrtcAddress: :8443
webrtcEncryption: no
webrtcAllowOrigin: "*"

# HLS settings - Optimized for Low Latency
hls: yes
hlsAddress: :8888
hlsEncryption: no
hlsAllowOrigin: "*"
hlsAlwaysRemux: no
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50M

# RTSP settings
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp, udp]
rtspEncryption: "no"

# Path configuration for H.264 streaming
paths:
  cam:
    # Camera publishes to this path via RTSP
    sourceOnDemand: no
    sourceAnyPortEnable: yes
    record: no