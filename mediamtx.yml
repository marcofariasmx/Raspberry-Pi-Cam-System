# MediaMTX Configuration for Raspberry Pi H.264 Streaming - LL-HLS Optimized

# General settings
logLevel: info
logDestinations: [stdout]

# API settings
api: yes
apiAddress: 127.0.0.1:9997

# Timeout settings - prevent broken pipe errors
readTimeout: 300s   # Increase from default 10s to 5 minutes
writeTimeout: 300s  # Increase from default 10s to 5 minutes

# Metrics
metrics: yes
metricsAddress: 127.0.0.1:9998

# WebRTC settings - DISABLED for performance optimization
webrtc: no

# HLS settings - Optimized for Low Latency
hls: yes
hlsAddress: :8888
hlsEncryption: no
hlsAllowOrigin: "*"
hlsAlwaysRemux: yes
hlsVariant: fmp4
hlsSegmentCount: 3
hlsSegmentDuration: 3s

hlsPartDuration: 500ms

hlsSegmentMaxSize: 5M
hlsDirectory: ''

# Performance optimizations
writeQueueSize: 2048              # Double the buffer


# RTSP settings
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
rtspEncryption: "no"

# Path configuration for H.264 streaming
paths:
  cam:
    # Camera publishes to this path via RTSP
    sourceOnDemand: no
    sourceAnyPortEnable: yes
    record: no